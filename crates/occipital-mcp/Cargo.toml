[package]
name        = "occipital-mcp"
description = "Occipital MCP-over-stdio server — polite web search/fetch + decaying knowledge cache"
version.workspace = true
edition     = "2021"
license.workspace = true

[[bin]]
name = "occipital-mcp"
path = "src/main.rs"

[features]
# Forwards to the lib: build with `--features embeddings` for Micro+ semantic recall.
embeddings = ["occipital/embeddings"]

[dependencies]
occipital        = { path = "../occipital" }
tokio.workspace  = true
serde.workspace  = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
async-trait.workspace = true
