[package]
name        = "occipital"
description = "The agent's reading cortex — polite web fetch, reader-mode, search providers, and a decaying knowledge cache"
version.workspace = true
edition     = "2021"
license.workspace = true
repository.workspace = true

[features]
# Opt-in semantic layer (Micro+ tier). Off by default so Nano builds skip the
# ONNX runtime entirely — smaller binary, faster build, no build-time download.
embeddings = ["dep:fastembed"]

[dependencies]
anyhow.workspace      = true
tracing.workspace     = true
dirs-next.workspace   = true
reqwest.workspace     = true
tokio.workspace       = true
url.workspace         = true
rand.workspace        = true
async-trait.workspace = true
scraper.workspace     = true
ego-tree.workspace    = true
serde.workspace       = true
serde_json.workspace  = true
rusqlite.workspace    = true
chrono.workspace      = true
fastembed             = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
